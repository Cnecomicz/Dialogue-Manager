name: Alice

vertices: 
    vertex_0:
        text: "Hello. You have {player.gold} gold. Want to buy a flower?"
        effects: []
    buy_flower:
        text: "Thanks. You now have {player.gold} gold. Want to buy another?"
        effects: [
            {type: "modify_list", target: "player.inventory", method: "append", value: "Flower"},
            {type: "modify_list", target: "alice.inventory", method: "remove", value: "Flower"},
        ]
    insufficient_gold:
        text: "You don't have enough money."
        effects: []
    insufficient_flowers:
        text: "I'm sorry. I'm all out of flowers."
        effects: []
    end:
        text: "Okay, goodbye."
        effects: []

edges:
    vertex_0_to_buy_flower:
        from: "vertex_0"
        to: "buy_flower"
        text: "Yes, I'll buy a flower."
        predicates: [
            {type: "check_value", path: "player.gold", op: ">=", value: 1},
            {type: "check_list", path: "alice.inventory", op: "in", value: "Flower"},
        ]
        effects: [
            {type: "modify_value", target: "player.gold", delta: -1},
        ]
    vertex_0_to_insufficient_flowers:
        from: "vertex_0"
        to: "insufficient_flowers"
        text: "Yes, I'll buy a flower."
        predicates: [
            {type: "check_value", path: "player.gold", op: ">=", value: 1},
            {type: "check_list", path: "alice.inventory", op: "not in", value: "Flower"},
        ]
        effects: []
    vertex_0_to_insufficient_gold:
        from: "vertex_0"
        to: "insufficient_gold"
        text: "Well, can I buy one with {player.gold} gold?"
        predicates: [
            {type: "check_value", path: "player.gold", op: "<", value: 1},
        ]
        effects: []
    vertex_0_to_end:
        from: "vertex_0"
        to: "end"
        text: "No thanks."
        predicates: []
        effects: []
    buy_flower_to_buy_flower:
        from: "buy_flower"
        to: "buy_flower"
        text: "Yes, I'll buy another."
        predicates: [
            {type: "check_value", path: "player.gold", op: ">=", value: 1},
            {type: "check_list", path: "alice.inventory", op: "in", value: "Flower"},
        ]
        effects: [
            {type: "modify_value", target: "player.gold", delta: -1},
        ]
    buy_flower_to_insufficient_flowers:
        from: "buy_flower"
        to: "insufficient_flowers"
        text: "Yes, I'll buy another."
        predicates: [
            {type: "check_value", path: "player.gold", op: ">=", value: 1},
            {type: "check_list", path: "alice.inventory", op: "not in", value: "Flower"},
        ]
        effects: []
    buy_flower_to_insufficient_gold:
        from: "buy_flower"
        to: "insufficient_gold"
        text: "I'm a little short. Can we make a deal?"
        predicates: [
            {type: "check_value", path: "player.gold", op: "<", value: 1},
        ]
        effects: []
    buy_flower_to_end:
        from: "buy_flower"
        to: "end"
        text: "No thanks, I have enough."
        predicates: []
        effects: []
